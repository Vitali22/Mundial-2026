<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Futbol Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-theme="dark">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <p class="eyebrow">TheSportsDB</p>
          <h1>Panel de torneos</h1>
        </div>

        <nav class="side-nav" aria-label="Torneos">
          <button class="nav-button active" type="button" data-tournament="worldcup">
            Mundial 2026
          </button>
          <button class="nav-button" type="button" data-tournament="champions">
            Champions League
          </button>
          <button class="nav-button" type="button" data-tournament="ligamx">
            Liga MX
          </button>
        </nav>

        <div class="sync-panel">
          <p id="provider-status">Fuente: TheSportsDB</p>
          <p id="last-update">Ultima actualizacion: cargando...</p>
          <button id="refresh-button" type="button">Actualizar torneo</button>
        </div>
      </aside>

      <main class="content">
        <section class="section-block">
          <div class="section-title">
            <div>
              <p id="tournament-eyebrow" class="eyebrow">Mundial 2026</p>
              <h2 id="tournament-title">Tabla y fase eliminatoria</h2>
            </div>
          </div>

          <div id="format-notes" class="format-notes"></div>

          <div class="view-tabs" role="tablist" aria-label="Vista del torneo">
            <button class="view-tab active" type="button" data-panel="table-panel">
              Tabla
            </button>
            <button class="view-tab" type="button" data-panel="finals-panel">
              Fase final
            </button>
          </div>

          <section id="table-panel" class="tournament-panel active">
            <div id="table-container" aria-live="polite"></div>
          </section>

          <section id="finals-panel" class="tournament-panel">
            <div id="finals-container" class="finals-board" aria-live="polite"></div>
          </section>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
