<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mundial Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <p class="eyebrow">Mundial 2026</p>
          <h1>Panel del torneo</h1>
        </div>

        <nav class="side-nav" aria-label="Vistas principales">
          <button class="nav-button active" type="button" data-view="groups-view">
            Fase de grupos
          </button>
          <button class="nav-button" type="button" data-view="bracket-view">
            Fase eliminatoria
          </button>
        </nav>

        <div class="sync-panel">
          <p id="provider-status">Modo: cargando...</p>
          <p id="last-update">Ultima actualizacion: cargando...</p>
          <button id="refresh-button" type="button">Actualizar datos</button>
        </div>
      </aside>

      <main class="content">
        <section id="groups-view" class="section-block view active">
          <div class="section-title">
            <div>
              <p class="eyebrow">12 grupos · 48 selecciones</p>
              <h2>Fase de grupos</h2>
            </div>
          </div>
          <div id="groups-container" class="groups-grid" aria-live="polite"></div>
        </section>

        <section id="bracket-view" class="section-block view">
          <div class="section-title">
            <div>
              <p class="eyebrow">Formato 2026</p>
              <h2>Fase eliminatoria</h2>
            </div>
          </div>
          <div id="bracket-container" class="bracket" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
